name: my_bar
description: "An application for managing your home bar and quickly selecting cocktails from what you already have at home."
publish_to: 'none' 

version: 1.0.0+53

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_border_widgets: ^0.2.0
  google_fonts: ^8.0.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.4
  loading_animation_widget: ^1.3.0
  file_picker: ^10.3.2
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  flutter_svg: ^2.2.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  meta: ^1.17.0
  image: ^4.2.0
  battery_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1022"
  color_dark: "#0B1022"
  image: assets/icon.png
  image_dark: assets/icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0B1022"
    color_dark: "#0B1022"
    image: assets/icon.png
    icon_background_color: "#0B1022"
    icon_background_color_dark: "#0B1022"

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/data/bar_template.json
    - assets/data/bar_template_ru.json
    - assets/data/catalog_images/
    - assets/icons/cocktails/